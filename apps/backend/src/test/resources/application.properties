spring.datasource.url=jdbc:h2:mem:backend-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

jwt.secret=test-secret-key-for-backend-tests-only-1234567890
jwt.expiration=86400000

app.admin.name=Test Admin
app.admin.email=admin@test.com
app.admin.password=Admin@123456

gemini.api.key=test-gemini-key
